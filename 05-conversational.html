<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>05 · Conversational · KWIQ Onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#00897b; --teal-h:#00796b; --teal-ink:#00594f;
  --teal-50:#E8F5F3; --teal-100:#CBE8E3; --teal-200:#9FD4CB;
  --page:#F7F9F9; --white:#fff; --tint:#F1F5F5;
  --l1:#162123; --l2:#4D5A5D; --l3:#86939A; --div:#E2E9EA;
  --amber:#B76E00;
  --r:12px; --r-sm:8px; --r-xs:6px; --r-full:999px;
  --sh-1:0 1px 2px rgba(14,40,44,.06),0 1px 1px rgba(14,40,44,.03);
  --sh-2:0 10px 30px -12px rgba(14,40,44,.18),0 2px 6px rgba(14,40,44,.05);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Mulish',system-ui,sans-serif;color:var(--l1);background:var(--page);
  -webkit-font-smoothing:antialiased;display:grid;grid-template-rows:auto 1fr auto;height:100vh;height:100dvh;overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
kbd{font-family:inherit;font-size:11px;font-weight:700;color:var(--l2);background:var(--white);border:1px solid var(--div);border-bottom-width:2px;border-radius:5px;padding:1px 6px;min-width:20px;display:inline-block;text-align:center}
svg{display:block}

/* ---------- Top bar ---------- */
.top{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;
  height:64px;padding:0 24px;background:rgba(247,249,249,.82);
  backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);
  border-bottom:1px solid var(--div);position:relative;z-index:5;
}
.dir-pill{
  justify-self:start;display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 12px;
  border:1px solid var(--div);border-radius:var(--r-full);background:var(--white);
  font-size:12px;font-weight:700;color:var(--l2);text-decoration:none;white-space:nowrap;
  transition:border-color .2s,color .2s,box-shadow .2s;
}
.dir-pill:hover{border-color:var(--teal-200);color:var(--teal-ink);box-shadow:var(--sh-1)}
.dir-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--teal)}
.top-mid{display:flex;flex-direction:column;align-items:center;gap:6px}
.top-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;letter-spacing:-.005em}
.top-title .muted{color:var(--l3);font-weight:600}
.mark{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(140deg,#14a596 0%,#00897b 55%,#006b60 100%);box-shadow:0 2px 6px -2px rgba(0,137,123,.6)}
.mark svg{width:13px;height:13px}
.progress{display:flex;gap:4px}
.progress i{width:28px;height:3px;border-radius:2px;background:var(--div);position:relative;overflow:hidden}
.progress i::after{content:"";position:absolute;inset:0;background:var(--teal);transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease)}
.progress i.on::after{transform:scaleX(1)}
.top-right{justify-self:end;display:flex;align-items:center;gap:4px}
.ghost{height:32px;padding:0 12px;border-radius:var(--r-sm);font-size:13px;font-weight:700;color:var(--l2);display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s}
.ghost:hover:not(:disabled){background:var(--tint);color:var(--l1)}
.ghost:disabled{opacity:.35;cursor:default}
.ghost svg{width:14px;height:14px}
.step-label{font-size:12px;font-weight:700;color:var(--l3);margin-right:8px;white-space:nowrap}

/* ---------- Chat ---------- */
.scroll{overflow-y:auto;overflow-x:hidden;scroll-behavior:auto}
.chat{max-width:720px;margin:0 auto;padding:32px 24px 40px;display:flex;flex-direction:column}
.group{display:flex;flex-direction:column;gap:10px;margin-top:22px;transition:opacity .22s ease,transform .22s ease}
.group:first-child{margin-top:0}
.group.out{opacity:0;transform:translateY(6px)}
.day{align-self:center;font-size:12px;font-weight:700;color:var(--l3);display:flex;align-items:center;gap:10px;margin:4px 0 14px;width:100%}
.day::before,.day::after{content:"";flex:1;height:1px;background:var(--div)}

.hello{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:16px 0 26px}
.orb{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;color:#fff;position:relative;
  background:radial-gradient(120% 120% at 20% 10%,#3cc4b4 0%,#00897b 50%,#005f55 100%);
  box-shadow:0 18px 36px -14px rgba(0,137,123,.65),inset 0 1px 0 rgba(255,255,255,.35)}
.orb svg{width:30px;height:30px}
.orb::after{content:"";position:absolute;inset:-8px;border-radius:26px;border:1px solid rgba(0,137,123,.18);animation:halo 3.2s var(--ease) infinite}
@keyframes halo{0%{opacity:.9;transform:scale(.94)}70%,100%{opacity:0;transform:scale(1.12)}}
.hello h1{font-size:24px;line-height:32px;font-weight:800;letter-spacing:-.01em}
.hello p{font-size:14px;line-height:20px;color:var(--l2)}

.msg{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;align-items:start;animation:msgIn .42s var(--ease) both}
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}}
.msg .av{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(140deg,#14a596,#00897b 55%,#006b60);box-shadow:0 4px 10px -4px rgba(0,137,123,.55)}
.msg .av svg{width:16px;height:16px}
.msg.cont .av{visibility:hidden;height:0}
.msg.cont{margin-top:-4px}
.who{font-size:12px;font-weight:800;color:var(--l1);margin:0 0 6px 2px;display:flex;gap:8px;align-items:baseline}
.who span{font-weight:600;color:var(--l3)}
.msg.cont .who{display:none}
.bub{display:inline-block;max-width:560px;background:var(--white);border:1px solid var(--div);border-radius:4px 16px 16px 16px;
  padding:11px 16px;font-size:15px;line-height:24px;box-shadow:var(--sh-1)}
.msg.cont .bub{border-radius:16px}
.bub b{font-weight:800}
.bub .hl{color:var(--teal-ink);font-weight:800}
.msg.u{grid-template-columns:1fr;justify-items:end;animation-name:userIn}
@keyframes userIn{from{opacity:0;transform:translateY(8px) scale(.96)}}
.msg.u .bub{background:var(--teal);color:#fff;border-color:transparent;border-radius:16px 16px 4px 16px;box-shadow:0 6px 16px -10px rgba(0,137,123,.9);font-weight:600}
.msg.u{transform-origin:right bottom}

.dots{display:inline-flex;gap:5px;align-items:center;height:46px;padding:0 18px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--teal-200);animation:bob 1.1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bob{0%,60%,100%{transform:translateY(0);opacity:.55}30%{transform:translateY(-4px);opacity:1}}

/* rich cards */
.rich-wrap{width:100%}
.card{background:var(--white);border:1px solid var(--div);border-radius:16px;box-shadow:var(--sh-1)}
.caps{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cap{padding:16px;display:flex;flex-direction:column;gap:10px;animation:capIn .5s var(--ease) both;animation-delay:calc(var(--i)*90ms);transition:box-shadow .2s,border-color .2s,transform .2s}
.cap:hover{border-color:var(--teal-200);box-shadow:var(--sh-2);transform:translateY(-1px)}
@keyframes capIn{from{opacity:0;transform:translateY(10px) scale(.98)}}
.cap-h{display:flex;align-items:center;gap:10px}
.ico{width:32px;height:32px;border-radius:9px;background:var(--teal-50);color:var(--teal);display:grid;place-items:center;flex:none}
.ico svg{width:17px;height:17px}
.cap-t{font-size:16px;line-height:20px;font-weight:800}
.cap-tag{font-size:13px;line-height:16px;font-weight:700;color:var(--teal-ink)}
.cap p{font-size:13px;line-height:20px;color:var(--l2)}
.ex{margin-top:auto;background:var(--tint);border-radius:var(--r-sm);padding:8px 10px;font-size:12px;line-height:16px;color:var(--l2);display:flex;flex-direction:column;gap:6px}
.ex-rank{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--l1)}
.ex-rank em{font-style:normal;width:16px;height:16px;border-radius:5px;background:var(--white);border:1px solid var(--div);display:grid;place-items:center;font-size:10px;color:var(--l3)}
.ex-rank b{margin-left:auto;color:var(--teal-ink);font-weight:800}
.ex-bub{background:var(--white);border:1px solid var(--div);border-radius:10px 10px 10px 3px;padding:6px 9px;color:var(--l1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-flow{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--l1)}
.ex-flow span{background:var(--white);border:1px solid var(--div);border-radius:6px;padding:3px 7px}
.ex-flow svg{width:12px;height:12px;color:var(--l3)}
.ex-q{font-style:italic;color:var(--l1)}

/* personalize */
.feat{padding:6px 0}
.feat-row{display:flex;align-items:center;gap:12px;padding:10px 16px}
.feat-row + .feat-row{border-top:1px solid var(--div)}
.feat-row .txt{flex:1;min-width:0}
.feat-row .n{font-size:14px;font-weight:800;line-height:20px}
.feat-row .d{font-size:12px;line-height:16px;color:var(--l3)}
.feat-row.off .ico{background:var(--tint);color:var(--l3)}
.feat-row.off .n{color:var(--l3)}
.sw{width:40px;height:24px;border-radius:12px;background:var(--div);position:relative;flex:none;transition:background .2s var(--ease)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .25s var(--ease)}
.sw[aria-checked="true"]{background:var(--teal)}
.sw[aria-checked="true"]::after{transform:translateX(16px)}
.sw:focus-visible,.chip:focus-visible,.act:focus-visible,.ghost:focus-visible,.send:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.trust{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;background:var(--teal-50);border-top:1px solid var(--teal-100);border-radius:0 0 16px 16px;font-size:13px;line-height:20px;color:var(--teal-ink)}
.trust svg{width:16px;height:16px;flex:none;margin-top:2px}
.group.past .sw,.group.past .act{pointer-events:none}
.group.past .acts{opacity:.5}

/* lead */
.lead{padding:16px}
.lead-top{display:flex;align-items:center;gap:12px}
.pav{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#7a3b12;background:linear-gradient(135deg,#FFE3C7,#F8C79A);flex:none}
.lead-top .nm{font-size:16px;line-height:20px;font-weight:800}
.lead-top .mt{font-size:13px;line-height:20px;color:var(--l2)}
.score{margin-left:auto;position:relative;width:52px;height:52px;flex:none}
.score svg{width:52px;height:52px;transform:rotate(-90deg)}
.score .trk{stroke:var(--teal-50)}
.score .val{stroke:var(--teal);stroke-linecap:round;stroke-dasharray:138.2;stroke-dashoffset:138.2;animation:ring 1.1s .2s var(--ease) forwards}
@keyframes ring{to{stroke-dashoffset:11.06}}
.score b{position:absolute;inset:0;display:grid;place-items:center;font-size:16px;font-weight:800;color:var(--teal-ink)}
.score small{position:absolute;bottom:-14px;left:0;right:0;text-align:center;font-size:10px;font-weight:700;color:var(--l3);letter-spacing:.04em}
.signals{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.sig{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:var(--r-full);background:var(--tint);font-size:12px;font-weight:700;color:var(--l2)}
.sig svg{width:13px;height:13px;color:var(--teal)}

/* draft */
.draft{overflow:hidden}
.draft-head{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--div);font-size:12px;line-height:16px;color:var(--l2);font-weight:700}
.draft-head .ch{background:var(--tint);color:var(--l1);border-radius:5px;padding:2px 6px;font-size:11px;font-weight:800;letter-spacing:.04em}
.draft-head .tone-tag{margin-left:auto;color:var(--teal-ink);background:var(--teal-50);border-radius:var(--r-full);padding:2px 9px}
.draft-head .writing{display:none;align-items:center;gap:6px;color:var(--teal-ink)}
.draft.streaming .writing{display:inline-flex}
.draft.streaming .tone-tag{display:none}
.writing i{width:6px;height:6px;border-radius:50%;background:var(--teal);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.draft-body{padding:16px;position:relative}
.draft-text{background:#EEF6F5;border-radius:16px 16px 16px 4px;padding:12px 16px;font-size:15px;line-height:24px;min-height:48px;outline:none;transition:box-shadow .2s}
.draft-text[contenteditable="true"]{background:#fff;box-shadow:0 0 0 2px var(--teal)}
.draft.streaming .draft-text::after{content:"";display:inline-block;width:2px;height:17px;background:var(--teal);margin-left:2px;vertical-align:-3px;animation:blink .9s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.draft.streaming .draft-body::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--teal),transparent);background-size:50% 100%;background-repeat:no-repeat;animation:sweep 1.2s linear infinite}
@keyframes sweep{from{background-position:-50% 0}to{background-position:150% 0}}
.draft-foot{display:flex;align-items:center;gap:8px;padding:0 16px 14px}
.count{font-size:12px;color:var(--l3);font-weight:600}
.acts{margin-left:auto;display:flex;gap:6px;transition:opacity .2s}
.act{height:32px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--div);background:#fff;font-size:13px;font-weight:700;color:var(--l1);display:inline-flex;align-items:center;gap:6px;transition:background .15s,border-color .15s,transform .1s}
.act:hover{background:var(--tint)}
.act:active{transform:scale(.97)}
.act svg{width:14px;height:14px}
.act.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.act.pri:hover{background:var(--teal-h)}
.draft.streaming .act{opacity:.45;pointer-events:none}
.note{font-size:12px;line-height:16px;color:var(--l3);margin:8px 0 0 2px}

/* done */
.find{padding:6px 0}
.find-row{display:flex;align-items:center;gap:16px;padding:12px 16px}
.find-row + .find-row{border-top:1px solid var(--div)}
.find-row .txt{flex:1}
.find-row .n{font-size:14px;line-height:20px;font-weight:800}
.find-row .d{font-size:13px;line-height:20px;color:var(--l2)}
.vis{width:132px;height:52px;border-radius:10px;background:var(--tint);flex:none;display:flex;align-items:center;justify-content:center;gap:6px;position:relative;overflow:hidden}
.mini-bar{position:absolute;inset:10px 10px auto 10px;height:32px;border-radius:8px;background:#fff;border:1px solid var(--div);display:flex;align-items:center;padding:0 6px;gap:6px}
.mini-bar .srch{flex:1;height:8px;border-radius:4px;background:var(--tint)}
.mini-bar .sp{width:22px;height:22px;border-radius:7px;background:var(--teal);color:#fff;display:grid;place-items:center;position:relative}
.mini-bar .sp svg{width:12px;height:12px}
.mini-bar .sp::after{content:"";position:absolute;inset:-4px;border-radius:10px;border:2px solid var(--teal);opacity:0;animation:ping 2s var(--ease) infinite}
@keyframes ping{0%{opacity:.7;transform:scale(.8)}80%,100%{opacity:0;transform:scale(1.25)}}
.vis kbd{font-size:14px;padding:4px 10px;border-radius:7px}
.today{position:absolute;inset:10px;background:#fff;border:1px solid var(--div);border-radius:8px;padding:6px 8px;display:flex;flex-direction:column;gap:4px}
.today b{font-size:10px;font-weight:800;color:var(--teal-ink)}
.today i{display:block;height:5px;border-radius:3px;background:var(--tint)}
.today i:nth-child(2){width:80%}.today i:nth-child(3){width:60%}
.summary{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.summary span{font-size:12px;font-weight:700;color:var(--teal-ink);background:var(--teal-50);border-radius:var(--r-full);padding:4px 10px}

/* ---------- Dock ---------- */
.dock{position:relative;background:linear-gradient(to bottom,rgba(247,249,249,0),var(--page) 26px);padding:10px 24px 16px;z-index:4}
.dock-inner{max-width:720px;margin:0 auto;padding:0 0 0 0}
.chips-wrap{min-height:44px;display:flex;align-items:flex-end;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips .lbl{font-size:12px;font-weight:700;color:var(--l3);margin-right:4px}
.chip{height:36px;padding:0 16px;border-radius:var(--r-full);border:1px solid var(--teal-100);background:#fff;font-size:14px;font-weight:700;color:var(--teal-ink);
  display:inline-flex;align-items:center;gap:8px;box-shadow:var(--sh-1);animation:chipIn .35s var(--ease) both;animation-delay:calc(var(--i)*60ms);
  transition:background .15s,border-color .15s,transform .12s,box-shadow .15s}
@keyframes chipIn{from{opacity:0;transform:translateY(6px)}}
.chip:hover{border-color:var(--teal);background:var(--teal-50)}
.chip:active{transform:scale(.97)}
.chip.pri{background:var(--teal);border-color:var(--teal);color:#fff;box-shadow:0 6px 16px -8px rgba(0,137,123,.8)}
.chip.pri:hover{background:var(--teal-h)}
.chip small{font-size:12px;font-weight:600;opacity:.7}
.chip kbd{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.3);color:#fff;font-size:10px;padding:0 5px}
.chip svg{width:14px;height:14px}
.composer{display:flex;align-items:center;gap:10px;height:52px;padding:0 8px 0 16px;background:#fff;border:1px solid var(--div);border-radius:16px;box-shadow:var(--sh-2);transition:border-color .2s,box-shadow .2s}
.composer:focus-within{border-color:var(--teal-200);box-shadow:var(--sh-2),0 0 0 4px rgba(0,137,123,.08)}
.composer .spk{color:var(--teal);width:18px;height:18px;flex:none}
.composer input{flex:1;min-width:0;border:0;outline:none;font:inherit;font-size:15px;color:var(--l1);background:transparent}
.composer input::placeholder{color:var(--l3)}
.send{width:36px;height:36px;border-radius:11px;background:var(--teal);color:#fff;display:grid;place-items:center;transition:background .15s,transform .1s}
.send:hover{background:var(--teal-h)}
.send:active{transform:scale(.95)}
.send svg{width:16px;height:16px}
.foot{display:flex;justify-content:space-between;gap:16px;margin-top:10px;font-size:12px;line-height:16px;color:var(--l3)}
.foot .keys{display:flex;gap:10px;align-items:center;white-space:nowrap}

.toast{position:fixed;left:50%;top:76px;transform:translate(-50%,-8px);background:var(--l1);color:#fff;font-size:13px;font-weight:700;padding:8px 14px;border-radius:var(--r-full);opacity:0;pointer-events:none;transition:opacity .2s,transform .25s var(--ease);z-index:20;display:flex;align-items:center;gap:8px}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast svg{width:14px;height:14px}

@media (max-width:1100px){
  .top-title .muted{display:none}
  .step-label{display:none}
}
@media (max-width:760px){
  .caps{grid-template-columns:1fr}
  .vis{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0ms!important;transition-duration:.01ms!important}
  .score .val{stroke-dashoffset:11.06}
}
</style>
</head>
<body>

<header class="top">
  <a class="dir-pill" href="index.html"><span class="dot"></span>05 · Conversational · All directions ↗</a>
  <div class="top-mid">
    <div class="top-title"><span class="mark" id="markTop"></span>KWIQ <span class="muted">· Getting started</span></div>
    <div class="progress" id="progress" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  </div>
  <div class="top-right">
    <span class="step-label" id="stepLabel" aria-live="polite"></span>
    <button class="ghost" id="backBtn" title="Rewind (←)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M7 4 3 8l4 4"/></svg>Back</button>
    <button class="ghost" id="skipBtn" title="Skip (Esc)">Skip</button>
  </div>
</header>

<main class="scroll" id="scroll">
  <div class="chat" id="chat" aria-live="polite"></div>
</main>

<footer class="dock">
  <div class="dock-inner">
    <div class="chips-wrap"><div class="chips" id="chips"></div></div>
    <form class="composer" id="composer" autocomplete="off">
      <span class="spk" id="spk"></span>
      <input id="input" type="text" placeholder="Reply to KWIQ, or pick a suggestion" aria-label="Message KWIQ">
      <button class="send" type="submit" aria-label="Send"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg></button>
    </form>
    <div class="foot">
      <span>KWIQ can make mistakes. Review before sending.</span>
      <span class="keys"><span><kbd>⏎</kbd> next</span><span><kbd>←</kbd> rewind</span><span><kbd>esc</kbd> skip</span></span>
    </div>
  </div>
</footer>

<div class="toast" id="toast" role="status"></div>

<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);

/* ---------- Icons ---------- */
const sv = (p, sw) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw||1.9}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICON = {
  spark: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5c.4 0 .7.3.8.7l.9 3.6a6 6 0 0 0 4.4 4.4l3.6.9a.8.8 0 0 1 0 1.6l-3.6.9a6 6 0 0 0-4.4 4.4l-.9 3.6a.8.8 0 0 1-1.6 0l-.9-3.6a6 6 0 0 0-4.4-4.4l-3.6-.9a.8.8 0 0 1 0-1.6l3.6-.9a6 6 0 0 0 4.4-4.4l.9-3.6c.1-.4.4-.7.8-.7Z"/></svg>`,
  rank: sv('<path d="M4 6h10M4 12h7M4 18h4"/><path d="M18 20V8m0 0-3 3m3-3 3 3"/>'),
  pen: sv('<path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4"/>'),
  notes: sv('<rect x="5" y="3.5" width="14" height="17" rx="2.5"/><path d="M9 8.5h6M9 12h6M9 15.5h3.5"/>'),
  ask: sv('<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/><path d="M9.3 9.4a1.8 1.8 0 0 1 3.4.8c0 1.2-1.7 1.4-1.7 2.4M11 14.3h.01"/>'),
  eye: sv('<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.8"/>'),
  bookmark: sv('<path d="M6.5 4h11v16.5L12 16.8l-5.5 3.7Z"/>'),
  bolt: sv('<path d="M13 3 5 13.5h6L10 21l8-10.5h-6Z"/>'),
  lock: sv('<rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/>'),
  refresh: sv('<path d="M20 11.5A8 8 0 0 0 6 6.6L4 8.5M4 4v4.5h4.5M4 12.5a8 8 0 0 0 14 4.9l2-1.9M20 20v-4.5h-4.5"/>'),
  check: sv('<path d="m5 12.5 4.5 4.5L19 7.5"/>', 2.2),
  arrow: sv('<path d="M5 12h14m-5-5 5 5-5 5"/>', 2)
};
$('#markTop').innerHTML = ICON.spark;
$('#spk').innerHTML = ICON.spark;

/* ---------- Content ---------- */
const STEPS = ['Welcome','Capabilities','Personalize','Try it','Done'];
const CAPS = [
  {k:'prioritize', t:'Prioritize', tag:'Know who to call first', ic:'rank',
   d:'I rank your leads each morning by signals like listing views, saved searches and replies.',
   ex:`<div class="ex-rank"><em>1</em>Priya Patel<b>92</b></div><div class="ex-rank"><em>2</em>Marcus Lee<b>87</b></div>`},
  {k:'draft', t:'Draft', tag:'Follow up in your voice', ic:'pen',
   d:'Texts and emails written from the lead’s activity, ready for you to edit and send.',
   ex:`<div class="ex-bub">Hi Priya! Two new 3-bedrooms just hit the market…</div>`},
  {k:'summarize', t:'Summarize', tag:'Never retype call notes', ic:'notes',
   d:'Calls and meetings become contact notes and next-step tasks.',
   ex:`<div class="ex-flow"><span>Call · 12 min</span>${sv('<path d="M5 12h14m-5-5 5 5-5 5"/>',2)}<span>1 note · 2 tasks</span></div>`},
  {k:'ask', t:'Ask', tag:'Ask your database anything', ic:'ask',
   d:'Get answers about your contacts and pipeline in plain language.',
   ex:`<div class="ex-q">“Who in my sphere haven’t I talked to in 90 days?”</div>`}
];
const TONES = [
  {k:'warm', label:'Warm', sub:'Friendly and personal'},
  {k:'direct', label:'Direct', sub:'Short and to the point'},
  {k:'polished', label:'Polished', sub:'Professional and refined'}
];
const DRAFTS = {
  warm: [
    "Hi Priya! I saw you've been looking at a few homes in 78704. Two new 3-bedrooms hit the market this morning under $650K. Want me to set up a showing this weekend?",
    "Hi Priya, hope your week's off to a great start! A couple of fresh 3-bedroom listings in 78704 just came up under $650K, and they made me think of you right away. Would Saturday or Sunday work for a quick look?"
  ],
  direct: [
    "Hi Priya, two new 3-bed homes in 78704 listed this morning, both under $650K. Want to see them this weekend? I have Saturday at 10 or 2 open.",
    "Priya, 2 new 3-bd listings in 78704 under $650K today. Both match your saved search. Free this weekend for a showing?"
  ],
  polished: [
    "Good morning, Priya. Two new three-bedroom homes in 78704 came to market today, both under $650,000 and well aligned with your search. I'd be glad to arrange private showings this weekend at your convenience.",
    "Hello Priya, I wanted to share two new three-bedroom listings in 78704, each priced under $650,000. Given the homes you've been viewing, I think both are worth a look. Shall I reserve a time for you this weekend?"
  ]
};

/* ---------- State ---------- */
const state = {
  tone:'warm', draftIdx:0,
  features:{prioritize:true, draft:true, summarize:true, ask:true},
  history:[], busy:false, tok:null, editing:false
};
const CANCEL = {cancel:true};
const chk = t => { if (t.c) throw CANCEL; };
const RM = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait = ms => new Promise(r => setTimeout(r, RM() ? ms * 0.2 : ms));
const toneLabel = () => TONES.find(x => x.k === state.tone).label;
const onCount = () => Object.values(state.features).filter(Boolean).length;
const NUM = ['zero','one','two','three','four'];

const chat = $('#chat'), scroller = $('#scroll'), chipsEl = $('#chips'), input = $('#input');

/* ---------- DOM helpers ---------- */
function toBottom(){
  requestAnimationFrame(() => scroller.scrollTo({top: scroller.scrollHeight, behavior: RM() ? 'auto' : 'smooth'}));
}
function lastMsgIsKwiq(){
  const all = chat.querySelectorAll('.group:not(.out) .msg');
  const m = all[all.length - 1];
  return !!m && m.classList.contains('k');
}
function kRow(html, rich, extra){
  const r = document.createElement('div');
  r.className = 'msg k' + (rich ? ' rich' : '') + (lastMsgIsKwiq() ? ' cont' : '') + (extra ? ' ' + extra : '');
  r.innerHTML = `<div class="av">${ICON.spark}</div><div class="body"><div class="who">KWIQ <span>now</span></div>${rich ? `<div class="rich-wrap">${html}</div>` : `<div class="bub">${html}</div>`}</div>`;
  return r;
}
function uRow(text){
  const r = document.createElement('div');
  r.className = 'msg u';
  const b = document.createElement('div'); b.className = 'bub'; b.textContent = text;
  r.append(b); return r;
}
function typingRow(){
  const r = kRow('', false, 'typing');
  const b = r.querySelector('.bub');
  b.classList.add('dots'); b.innerHTML = '<i></i><i></i><i></i>';
  b.setAttribute('aria-label', 'KWIQ is typing');
  return r;
}

async function say(g, t, anim, html, o){
  o = o || {};
  if (anim){
    const ty = typingRow(); g.append(ty); toBottom();
    try { await wait(o.typing || 700); } finally { ty.remove(); }
    chk(t);
  }
  const r = kRow(html, o.rich); g.append(r); toBottom();
  return r;
}

/* ---------- Rich blocks ---------- */
function capsHTML(){
  return `<div class="caps">${CAPS.map((c,i)=>`
    <div class="card cap" style="--i:${i}">
      <div class="cap-h"><span class="ico">${ICON[c.ic]}</span><div><div class="cap-t">${c.t}</div><div class="cap-tag">${c.tag}</div></div></div>
      <p>${c.d}</p>
      <div class="ex">${c.ex}</div>
    </div>`).join('')}</div>`;
}
function featHTML(){
  return `<div class="card feat">${CAPS.map(c=>`
    <div class="feat-row ${state.features[c.k]?'':'off'}" data-k="${c.k}">
      <span class="ico">${ICON[c.ic]}</span>
      <div class="txt"><div class="n">${c.t}</div><div class="d">${c.tag}</div></div>
      <button class="sw" role="switch" aria-checked="${state.features[c.k]}" aria-label="${c.t}" data-k="${c.k}"></button>
    </div>`).join('')}
    <div class="trust">${ICON.lock}<span>KWIQ only uses data in your Command account. Nothing sends without your OK.</span></div>
  </div>`;
}
function leadHTML(){
  return `<div class="card lead">
    <div class="lead-top">
      <div class="pav">PP</div>
      <div><div class="nm">Priya Patel</div><div class="mt">Buyer lead · Austin, 78704 · Last active 11:42 PM</div></div>
      <div class="score" title="KWIQ score"><svg viewBox="0 0 52 52"><circle class="trk" cx="26" cy="26" r="22" fill="none" stroke-width="5"/><circle class="val" cx="26" cy="26" r="22" fill="none" stroke-width="5"/></svg><b>92</b><small>SCORE</small></div>
    </div>
    <div class="signals">
      <span class="sig">${ICON.eye}Viewed 4 listings in 78704 last night</span>
      <span class="sig">${ICON.bookmark}Saved search: 3 bd under $650K</span>
      <span class="sig">${ICON.bolt}Score 92</span>
    </div>
  </div>`;
}
function draftHTML(){
  return `<div class="card draft">
    <div class="draft-head"><span class="ch">TEXT</span>To Priya Patel · (512) 555-0148
      <span class="writing"><i></i>KWIQ is writing</span>
      <span class="tone-tag">${toneLabel()} tone</span></div>
    <div class="draft-body"><p class="draft-text"></p></div>
    <div class="draft-foot"><span class="count">0 characters</span>
      <div class="acts">
        <button class="act" data-a="edit">${ICON.pen}<span>Edit</span></button>
        <button class="act" data-a="regen">${ICON.refresh}Regenerate</button>
        <button class="act pri" data-a="use">${ICON.check}Use draft</button>
      </div>
    </div>
  </div>
  <p class="note">KWIQ can make mistakes. Review before sending.</p>`;
}
function findHTML(){
  return `<div class="card find">
    <div class="find-row"><div class="vis"><div class="mini-bar"><span class="srch"></span><span class="sp">${ICON.spark}</span></div></div>
      <div class="txt"><div class="n">The sparkle in the top bar</div><div class="d">Open KWIQ from any page in Command.</div></div></div>
    <div class="find-row"><div class="vis"><kbd>⌘</kbd><kbd>K</kbd></div>
      <div class="txt"><div class="n">Press ⌘K anywhere</div><div class="d">Ask a question or start a draft without leaving your work.</div></div></div>
    <div class="find-row"><div class="vis"><div class="today"><b>TODAY · 3 to call</b><i></i><i></i><i></i></div></div>
      <div class="txt"><div class="n">Your Today view</div><div class="d">Ranked leads and ready drafts, waiting each morning.</div></div></div>
  </div>
  <div class="summary"><span>${onCount()} of 4 features on</span><span>${toneLabel()} tone</span></div>`;
}

/* ---------- Draft streaming ---------- */
function draftEl(){ const g = curGroup(); return g && g.dataset.step === '3' ? g.querySelector('.draft') : null; }
function setCount(d){
  const n = d.querySelector('.draft-text').textContent.length;
  d.querySelector('.count').textContent = `${n} characters · ${n > 160 ? 2 : 1} SMS`;
}
async function streamDraft(d, t, anim){
  const out = d.querySelector('.draft-text');
  const txt = DRAFTS[state.tone][state.draftIdx];
  d.querySelector('.tone-tag').textContent = toneLabel() + ' tone';
  out.textContent = '';
  if (!anim || RM()){ out.textContent = txt; setCount(d); return; }
  d.classList.add('streaming');
  try {
    const parts = txt.match(/\S+\s*/g);
    for (const p of parts){
      out.textContent += p; setCount(d);
      await wait(34 + Math.random() * 46); chk(t);
      if (Math.random() < 0.04) { await wait(180); chk(t); }
    }
  } finally { d.classList.remove('streaming'); }
}

/* ---------- Step scripts ---------- */
async function renderStep(n, g, t, anim){
  const S = (html, o) => say(g, t, anim, html, o);
  const W = async ms => { if (anim){ await wait(ms); chk(t); } };
  try {
    if (g.dataset.reply){ g.append(uRow(g.dataset.reply)); toBottom(); await W(380); }
    if (n === 0){
      const h = document.createElement('div');
      h.className = 'hello';
      h.innerHTML = `<div class="orb">${ICON.spark}</div><h1>KWIQ, your AI in Command</h1><p>A two-minute setup, right here in chat</p>`;
      g.append(h);
      const d = document.createElement('div'); d.className = 'day'; d.textContent = 'Today · 8:42 AM'; g.append(d);
      await W(500);
      await S(`Hi Jordan, I'm <b>KWIQ</b>, your AI in Command.`, {typing:800});
      await S(`I help you know who to call first, follow up in your voice and keep your notes tidy, so you spend more time with clients and less time in your CRM.`, {typing:1100});
      await S(`Want a quick tour? It takes about two minutes.`, {typing:600});
    }
    else if (n === 1){
      await S(`Great. Here's what I can do across Command.`, {typing:650});
      await S(capsHTML(), {rich:true, typing:900});
      await W(700);
      await S(`You stay in control. I suggest and draft, and <b>you decide</b> what goes out.`, {typing:800});
    }
    else if (n === 2){
      await S(`Let's make me yours. Which features should I turn on? They're all on to start.`, {typing:700});
      await S(featHTML(), {rich:true, typing:700});
      await W(300);
      await S(`And how should your drafts sound? Pick a tone below.`, {typing:700});
    }
    else if (n === 3){
      await S(`Let's try it on your pipeline. Here's your top lead this morning.`, {typing:800});
      await S(leadHTML(), {rich:true, typing:900});
      await W(400);
      const off = !state.features.draft ? ` You turned Draft off, so this is just a preview.` : '';
      await S(`Two new listings match her search, so now's a great time to reach out. I drafted a text in your <span class="hl">${toneLabel()}</span> tone.${off}`, {typing:900});
      const row = await S(draftHTML(), {rich:true, typing:1000});
      await streamDraft(row.querySelector('.draft'), t, anim);
    }
    else if (n === 4){
      await S(`<b>You're all set, Jordan.</b> I'll have your leads ranked by tomorrow morning.`, {typing:800});
      await S(`Here's where to find me in Command.`, {typing:600});
      await S(findHTML(), {rich:true, typing:800});
    }
    return true;
  } catch (e) {
    if (e === CANCEL) return false;
    throw e;
  }
}

/* ---------- Chips ---------- */
function chipDefs(n){
  switch (n){
    case 0: return {lbl:'Suggested', list:[{l:'Get started', p:1, f:()=>advance(1,'Get started')},{l:'Skip for now', f:skip}]};
    case 1: return {lbl:'Suggested', list:[{l:'Set it up', p:1, f:()=>advance(2,"Let's set it up")},{l:'Skip for now', f:skip}]};
    case 2: return {lbl:'Pick a tone', list:TONES.map(x=>({l:x.label, sub:x.sub, p:state.tone===x.k, f:()=>pickTone(x.k)}))};
    case 3: return {lbl:'Suggested', list:[{l:'Use draft', p:1, f:useDraft},{l:'Regenerate', ic:'refresh', f:regen},{l:state.editing?'Done editing':'Edit', ic:'pen', f:toggleEdit}]};
    case 4: return {lbl:'Suggested', list:[{l:'Go to Command', p:1, f:goCommand},{l:'Restart', ic:'refresh', f:restart}]};
  }
}
let chipFns = [];
function renderChips(n){
  chipsEl.innerHTML = ''; chipFns = [];
  if (n == null) return;
  const def = chipDefs(n);
  const lbl = document.createElement('span'); lbl.className = 'lbl'; lbl.textContent = def.lbl; chipsEl.append(lbl);
  def.list.forEach((c, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (c.p ? ' pri' : '');
    b.style.setProperty('--i', i);
    b.innerHTML = (c.ic ? ICON[c.ic] : '') + `<span>${c.l}</span>` + (c.sub ? `<small>${c.sub}</small>` : '') + (c.p ? '<kbd>⏎</kbd>' : '');
    b.addEventListener('click', c.f);
    chipsEl.append(b);
    chipFns.push(c);
  });
}
function primary(){
  if (state.busy) return;
  const c = chipFns.find(x => x.p);
  if (c) c.f();
}

/* ---------- Flow ---------- */
const curGroup = () => { const gs = chat.querySelectorAll('.group:not(.out)'); return gs[gs.length - 1]; };
const cur = () => state.history[state.history.length - 1];

function setStep(){
  const n = cur();
  document.querySelectorAll('#progress i').forEach((el, i) => el.classList.toggle('on', i <= n));
  $('#stepLabel').textContent = `${n + 1} of 5 · ${STEPS[n]}`;
  $('#backBtn').disabled = state.history.length < 2;
  $('#skipBtn').style.visibility = n === 4 ? 'hidden' : 'visible';
}

async function advance(n, reply){
  if (state.busy) return;
  stopEdit();
  const prev = curGroup(); if (prev) prev.classList.add('past');
  const g = document.createElement('div');
  g.className = 'group'; g.dataset.step = n;
  if (reply) g.dataset.reply = reply;
  chat.append(g);
  state.history.push(n); setStep(); renderChips(null);
  state.busy = true;
  const t = {c:false}; state.tok = t;
  const ok = await renderStep(n, g, t, true);
  if (ok && state.tok === t){ state.busy = false; renderChips(n); }
}

async function settle(){
  if (!state.busy) return;
  state.tok.c = true; state.busy = false;
  const g = curGroup(); if (!g) return;
  g.innerHTML = '';
  await renderStep(+g.dataset.step, g, {c:false}, false);
}

function back(){
  if (state.history.length < 2) return;
  if (state.busy){ state.tok.c = true; state.busy = false; }
  stopEdit();
  const g = curGroup();
  g.classList.add('out');
  setTimeout(() => g.remove(), RM() ? 0 : 240);
  state.history.pop();
  const p = cur();
  const pg = curGroup(); if (pg) pg.classList.remove('past');
  setStep(); renderChips(p);
  toast(`${ICON.refresh}Rewound to ${STEPS[p]}`);
  toBottom();
}

async function skip(){
  if (cur() === 4) return;
  await settle();
  advance(4, 'Skip for now');
}

function pickTone(k){
  state.tone = k; state.draftIdx = 0;
  const on = onCount();
  advance(3, `${toneLabel()}, please` + (on < 4 ? ` · keep ${NUM[on]} of 4 on` : ''));
}

function useDraft(){ advance(4, 'Use this draft'); }

async function regen(){
  if (state.busy) return;
  const d = draftEl(); if (!d) return;
  stopEdit();
  state.draftIdx = (state.draftIdx + 1) % 2;
  state.busy = true; renderChips(null);
  const t = {c:false}; state.tok = t;
  try { await streamDraft(d, t, true); } catch (e) { if (e !== CANCEL) throw e; return; }
  if (state.tok === t){ state.busy = false; renderChips(3); }
}

function toggleEdit(){
  const d = draftEl(); if (!d || state.busy) return;
  if (state.editing){ stopEdit(); renderChips(3); return; }
  const p = d.querySelector('.draft-text');
  p.contentEditable = 'true'; state.editing = true;
  d.querySelector('[data-a="edit"] span').textContent = 'Done';
  p.focus();
  const r = document.createRange(); r.selectNodeContents(p); r.collapse(false);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  p.oninput = () => setCount(d);
  renderChips(3);
}
function stopEdit(){
  if (!state.editing) return;
  state.editing = false;
  chat.querySelectorAll('.draft-text[contenteditable="true"]').forEach(p => p.contentEditable = 'false');
  chat.querySelectorAll('[data-a="edit"] span').forEach(s => s.textContent = 'Edit');
}

function goCommand(){ toast(`${ICON.check}Opening Command (end of prototype)`); }

function restart(){
  if (state.tok) state.tok.c = true;
  state.busy = false; state.editing = false;
  state.tone = 'warm'; state.draftIdx = 0;
  Object.keys(state.features).forEach(k => state.features[k] = true);
  state.history = [];
  chat.innerHTML = '';
  scroller.scrollTop = 0;
  advance(0, null);
}

let toastT;
function toast(html){
  const el = $('#toast'); el.innerHTML = html; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 1800);
}

/* ---------- Free-text replies ---------- */
async function handleText(text){
  if (state.busy) return;
  const n = cur();
  if (n === 2){
    const m = TONES.find(x => text.toLowerCase().includes(x.k));
    if (m){ state.tone = m.k; state.draftIdx = 0; }
    advance(3, text); return;
  }
  if (n < 4){ advance(n === 3 ? 4 : n + 1, text); return; }
  const g = curGroup();
  g.append(uRow(text)); toBottom();
  state.busy = true; renderChips(null);
  const t = {c:false}; state.tok = t;
  try {
    await wait(300); chk(t);
    await say(g, t, true, `Good one. Open Command and press <b>⌘K</b> to ask me that with your real data.`, {typing:900});
  } catch (e) { if (e !== CANCEL) throw e; return; }
  if (state.tok === t){ state.busy = false; renderChips(4); }
}

/* ---------- Events ---------- */
chat.addEventListener('click', e => {
  const sw = e.target.closest('.sw');
  if (sw){
    const k = sw.dataset.k; state.features[k] = !state.features[k];
    sw.setAttribute('aria-checked', state.features[k]);
    sw.closest('.feat-row').classList.toggle('off', !state.features[k]);
    return;
  }
  const a = e.target.closest('.act');
  if (a && !state.busy){
    if (a.dataset.a === 'edit') toggleEdit();
    else if (a.dataset.a === 'regen') regen();
    else if (a.dataset.a === 'use'){ stopEdit(); useDraft(); }
  }
});
$('#backBtn').addEventListener('click', back);
$('#skipBtn').addEventListener('click', skip);
$('#composer').addEventListener('submit', e => {
  e.preventDefault();
  const v = input.value.trim();
  if (!v){ primary(); return; }
  input.value = '';
  handleText(v);
});
document.addEventListener('keydown', e => {
  const tg = e.target;
  if (tg.isContentEditable){
    if (e.key === 'Escape' || (e.key === 'Enter' && !e.shiftKey)){ e.preventDefault(); stopEdit(); renderChips(3); tg.blur(); }
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const inInput = tg === input;
  if (inInput && input.value.trim()) return;
  if (e.key === 'Enter' || e.key === 'ArrowRight'){
    if (e.key === 'Enter' && (tg.tagName === 'BUTTON' || tg.tagName === 'A')) return;
    e.preventDefault(); primary();
  } else if (e.key === 'ArrowLeft'){
    e.preventDefault(); back();
  } else if (e.key === 'Escape'){
    e.preventDefault(); skip();
  }
});

advance(0, null);
})();
</script>
